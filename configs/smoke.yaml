paper:
  slug: doubly-relaxed-knowledge-distillation-for-deep-face-recognition
  title: "Doubly Relaxed Knowledge Distillation for Deep Face Recognition"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  calfw_root: ../../datasets/calfw/extracted/calfw-hf
  cplfw_root: ../../datasets/cplfw/extracted/cplfw-hf
  root: ../../datasets/celeba/extracted/celeba
  train_ratio: 0.7
  max_images: 1024
model:
  image_size: 112
  teacher: resnet50
  student: resnet18
  pretrained: true
train:
  protocol: smoke
  seed: 42
  num_workers: 2
  batch_size: 32
  teacher_epochs: 1
  student_epochs: 1
  teacher_lr: 0.05
  student_lr: 0.05
  lambda_ce: 1.0
  lambda_kd: 1.0
eval:
  batch_size: 64
  max_lfw_pairs: 200
  max_calfw_pairs: 200
  max_cplfw_pairs: 200
paths:
  checkpoint_dir: outputs/checkpoints/smoke
  log_dir: outputs/logs/smoke
  pred_dir: outputs/predictions/smoke
  figure_dir: outputs/figures/smoke
device: cuda
