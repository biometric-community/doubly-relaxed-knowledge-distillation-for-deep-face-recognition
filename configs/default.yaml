paper:
  slug: doubly-relaxed-knowledge-distillation-for-deep-face-recognition
  title: "Doubly Relaxed Knowledge Distillation for Deep Face Recognition"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  calfw_root: ../../datasets/calfw/extracted/calfw-hf
  cplfw_root: ../../datasets/cplfw/extracted/cplfw-hf
  root: ../../datasets/celeba/extracted/celeba
  train_ratio: 0.7
  max_images: null
model:
  image_size: 112
  teacher: resnet50
  student: resnet18
  pretrained: true
train:
  protocol: full
  seed: 42
  num_workers: 4
  batch_size: 64
  teacher_epochs: 6
  student_epochs: 10
  teacher_lr: 0.05
  student_lr: 0.05
  lambda_ce: 1.0
  lambda_kd: 1.0
eval:
  batch_size: 128
  max_lfw_pairs: null
  max_calfw_pairs: null
  max_cplfw_pairs: null
paths:
  checkpoint_dir: outputs/checkpoints/full
  log_dir: outputs/logs/full
  pred_dir: outputs/predictions/full
  figure_dir: outputs/figures/full
device: cuda
